<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Entrar — Primórdios</title>
  <link rel="icon" href="../assets/images/LogoT.png" type="image/png">
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/tela0.css">
  <link rel="stylesheet" href="../styles/preferencias.css">
  <link rel="stylesheet" href="../styles/consentimento-audio.css">
  <script src="../scripts/i18n-content.js"></script>
<script src="../scripts/preferencias.js"></script>
  <script src="../scripts/auth-online.js"></script>
<link rel="stylesheet" href="../styles/mobile.css?v=mobile-1">
</head>
<body>
  <main class="login-wrapper">
    <header class="login-header">
      <img src="../assets/images/LogoT.png" class="login-logo" alt="Primórdios">
      <h1 class="login-titulo">Primórdios</h1>
      <p class="login-sub">Entre para continuar sua jornada</p>
    </header>
    <div class="login-form">
      <p class="auth-ajuda">Use sua conta Google. Na primeira entrada, você escolhe como quer ser chamado por aqui.</p>
      <button type="button" id="entrarGoogle" class="btn-google" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.89-1.74 2.98-4.3 2.98-7.36Z"/><path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.62-2.41l-3.24-2.51c-.9.6-2.04.96-3.38.96-2.6 0-4.8-1.76-5.59-4.12H3.06v2.59A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.41 13.92A6 6 0 0 1 6.1 12c0-.67.11-1.32.31-1.92V7.49H3.06A10 10 0 0 0 2 12c0 1.61.38 3.14 1.06 4.51l3.35-2.59Z"/><path fill="#EA4335" d="M12 5.96c1.47 0 2.79.51 3.83 1.51l2.87-2.87A9.61 9.61 0 0 0 12 2a10 10 0 0 0-8.94 5.49l3.35 2.59C7.2 7.72 9.4 5.96 12 5.96Z"/></svg>
        Entrar com Google
      </button>
      <p id="loginErro" class="form-erro" role="alert"></p>
      <p id="loginInfo" class="form-sucesso" role="status">Preparando entrada…</p>
    </div>
  </main>
  <script src="../scripts/consentimento-audio.js"></script>
  <script src="../scripts/audio.js"></script>
  <script src="../scripts/sons.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const status = await PrimordiosAuth.status();
      document.getElementById('loginInfo').textContent = '';
      if (status.error) { document.getElementById('loginErro').textContent = status.error; return; }
      if (status.user) { location.replace(status.profileComplete ? 'inventario.html' : 'configurar-perfil.html'); return; }
      document.getElementById('entrarGoogle').disabled = false;
    });
    document.getElementById('entrarGoogle').addEventListener('click', async event => {
      event.currentTarget.disabled = true;
      document.getElementById('loginErro').textContent = '';
      try { await PrimordiosAuth.google(); }
      catch (error) { document.getElementById('loginErro').textContent = error.message; document.getElementById('entrarGoogle').disabled = false; }
    });
  </script>
  <script src="../scripts/espera-vinil.js"></script>
</body>
</html>
