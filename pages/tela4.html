<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fragmentados — Carregando...</title>
<link rel="icon" href="../assets/images/LogoT.png" type="image/png">
<link rel="stylesheet" href="../styles/global.css">
<style>
  body { background: #0a0a0f; }
  .tela { justify-content: center; }
</style>
<link rel="stylesheet" href="../styles/preferencias.css">
<script src="../scripts/i18n-content.js"></script>
<script src="../scripts/preferencias.js"></script>
<script src="../scripts/auth-online.js"></script>
<link rel="stylesheet" href="../styles/consentimento-audio.css">
<link rel="stylesheet" href="../styles/mobile.css?v=mobile-1">
</head>
<body>

<section class="tela">
  <div style="text-align:center;">
    <div id="loadingNome" style="font-size:1.4rem;letter-spacing:4px;color:#c9a84c;margin-bottom:30px;"></div>
    <div style="width:300px;height:2px;background:#1a1726;border-radius:2px;overflow:hidden;margin:0 auto 20px;">
      <div id="loadingBar" style="height:100%;width:0%;background:#c9a84c;transition:width 0.1s linear;"></div>
    </div>
    <div id="loadingMsg" style="font-size:0.75rem;letter-spacing:3px;color:#555;"></div>
  </div>
</section>

<script src="../scripts/estado.js?v=mana-1"></script>
<script>
  const LOADING_MSGS = [
    'Invocando as sombras...',
    'Afinando as cordas...',
    'Temperando o aço...',
    'Consultando os oráculos...',
    'Selando o pacto...',
    'Preparando o campo de batalha...',
    'Escrevendo seu destino...'
  ];

  window.addEventListener('load', async () => {
    if (!await PrimordiosAuth.ready) return;
    carregarEstadoBase();
    // Inicializa os recursos da ficha criada.
    [...CHAVES_FICHA, 'fragmentados_foto', 'fragmentados_desc'].forEach(k => sessionStorage.removeItem(k));
    const nome = document.getElementById('loadingNome');
    const bar  = document.getElementById('loadingBar');
    const msg  = document.getElementById('loadingMsg');
    nome.textContent = (estado.nomePersonagem || estado.classe || '').toUpperCase();
    let pct = 0, mi = 0;
    msg.textContent = LOADING_MSGS[0];
    const iv = setInterval(() => {
      pct += 2;
      bar.style.width = pct + '%';
      if (pct % 15 === 0) { mi = (mi + 1) % LOADING_MSGS.length; msg.textContent = LOADING_MSGS[mi]; }
      if (pct >= 100) { clearInterval(iv); setTimeout(() => window.location.href = 'tela5.html', 400); }
    }, 40);
  });
</script>
<script src="../scripts/consentimento-audio.js"></script>
<script src="../scripts/audio.js"></script>
<script src="../scripts/espera-vinil.js"></script>
</body>
</html>
