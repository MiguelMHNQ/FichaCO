<body>

<div id="navLogo" onclick="toggleMenu()">
  <img src="../assets/images/LogoT.png" alt="Primórdios">
  <div id="navMenu">
    <div class="nav-item" onclick="Sons.nav();window.location.href='inventario.html'"><span class="nav-item-icone">⚔</span> Inventário</div>
    <div class="nav-item" onclick="Sons.nav();novoPersonagem()"><span class="nav-item-icone">✦</span> Novo Personagem</div>
    <div class="nav-item" onclick="Sons.nav();window.location.href='livro.html'"><span class="nav-item-icone">⁂</span> Livro</div>
    <div class="nav-item" onclick="Sons.nav();window.location.href='tabletop.html'"><span class="nav-item-icone">⬡</span> TableTop</div>
    <div class="nav-item" onclick="Sons.nav();window.location.href='configuracoes.html'"><span class="nav-item-icone">⚙</span> Configurações</div>
    <div class="nav-item nav-sair" onclick="Sons.back();sair()"><span class="nav-item-icone">↩</span> Sair</div>
  </div>
</div>

<section class="tela">
  <h1 class="titulo-tela" style="width:100%;text-align:center;margin-bottom:6px;">Ficha do Personagem</h1>
  <p class="subtitulo-tela" style="width:100%;text-align:center;margin-bottom:20px;">Tudo pronto para a aventura</p>

  <div style="width:100%;max-width:1000px;margin:0 auto 24px;">
    <button class="btn-avancar habilitado" onclick="Sons.back();window.location.href='inventario.html'">← Voltar ao Inventário</button>
  </div>

  <button type="button" id="btnEditarFicha" class="ficha-editar-btn" onclick="toggleModoEdicao()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 4 5 5M4 20l5-1L21 7a2 2 0 0 0-5-5L4 14zM4 20h16"/></svg><span>Editar Ficha</span></button>

  <!-- Toolbar de edição -->
  <div id="fichaEditToolbar" style="display:none;width:100%;max-width:1000px;margin:0 auto 16px;background:#13111c;border:1px solid #c9a84c55;border-radius:4px;padding:14px 18px;gap:18px;flex-wrap:wrap;align-items:center;">
    <span class="edit-label">COR PRINCIPAL</span>
    <input type="color" id="editCorPrincipal" value="#c9a84c" style="width:32px;height:28px;border:none;background:transparent;cursor:pointer;" oninput="aplicarCores()">
    <span class="edit-label" style="margin-left:8px;">COR DO TEXTO</span>
    <input type="color" id="editCorTexto" value="#e0d6c8" style="width:32px;height:28px;border:none;background:transparent;cursor:pointer;" oninput="aplicarCores()">
    <span class="edit-label" style="margin-left:8px;">LAYOUT</span>
    <div style="display:flex;gap:8px;">
      <button id="layoutBtn1" class="layout-btn ativo" onclick="trocarLayout(1)" title="Layout Padrão">
        <svg width="28" height="22" viewBox="0 0 28 22"><rect x="1" y="1" width="7" height="20" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="1" width="7" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="12" width="7" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="19" y="1" width="8" height="20" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <button id="layoutBtn2" class="layout-btn" onclick="trocarLayout(2)" title="Layout Pergaminho">
        <svg width="28" height="22" viewBox="0 0 28 22"><rect x="5" y="1" width="18" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="5" y="9" width="18" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="5" y="15" width="18" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <button id="layoutBtn3" class="layout-btn" onclick="trocarLayout(3)" title="Layout Painel">
        <svg width="28" height="22" viewBox="0 0 28 22"><rect x="1" y="1" width="7" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="1" width="8" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="20" y="1" width="7" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="1" y="12" width="7" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="12" width="8" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="20" y="12" width="7" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
    <div style="flex:1;"></div>
    <button class="c-btn" style="width:auto;padding:0 12px;font-size:0.72rem;color:#aaa;" onclick="resetarLayoutFicha()">↺ Padrão</button>
    <button class="c-btn edit-btn-finalizar" style="width:auto;padding:0 12px;font-size:0.72rem;" onclick="toggleModoEdicao()">✔ Finalizar Edição</button>
  </div>

  <div class="ficha-viewport"><div id="fichaConteudo" style="width:100%;max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;gap:24px;"></div></div>
</section>

<!-- Popup Equipamento -->
<div id="popupEquip">
  <div class="popup-box">
    <div class="popup-box-header">
      <span id="popupEquipTitulo" class="popup-box-titulo"></span>
      <button class="c-btn" onclick="fecharPopupEquip()" style="color:#aaa;">&#x2715;</button>
    </div>
    <input type="search" id="popupEquipBusca" class="equipamento-busca" placeholder="Buscar equipamento" aria-label="Buscar equipamento" autocomplete="off" oninput="renderListaEquipamentos()">
    <div id="popupEquipLista" class="popup-box-lista"></div>
  </div>
</div>

<!-- Popup Caminho / Talentos -->
<div id="popupCaminhoTalentos">

    <div class="popup-box-header">

      <button class="c-btn" onclick="fecharPopupCT()" style="color:#aaa;">&#x2715;</button>
    </div>
    <div id="popupCTLista" class="popup-box-lista"></div>
  </div>
</div>

<!-- Popup Atributo -->
<div id="popupAtributo">
  <div class="popup-box" style="max-width:400px;">
    <div class="popup-box-header">
      <span id="popupAtributoTitulo" class="popup-box-titulo"></span>
      <button class="c-btn" onclick="fecharPopupAtributo()" style="color:#aaa;">✕</button>
    </div>
    <div id="popupAtributoLista"></div>
  </div>
</div>

<!-- Popup Info Classe (com navbar) -->
<div id="popupInfoClasse">
  <div class="popup-box" style="max-width:480px;max-height:82vh;display:flex;flex-direction:column;">
    <div class="popup-box-header">
      <span id="picTitulo" class="popup-box-titulo"></span>
      <button class="c-btn" onclick="fecharPopupInfoClasse()" style="color:#aaa;">✕</button>
    </div>
    <div id="picNavbar" style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;border-bottom:1px solid #2a2535;padding-bottom:10px;"></div>
    <div id="picConteudo" style="overflow-y:auto;flex:1;"></div>
  </div>
</div>

<!-- ===== BANDEJA DE DADOS ===== -->
<button type="button" id="diceBtn" class="dice-launcher" onclick="toggleDice()" title="Rolar dados" aria-label="Rolar dados" aria-expanded="false" aria-controls="dicePanel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="m12 2 10 6v8l-10 6-10-6V8zM2 8l10 6 10-6M12 14v8M12 2v12"/></svg></button>
<section id="dicePanel" class="dice-panel" aria-label="Bandeja de dados" hidden>
  <div class="dice-panel-header"><div><small>PRIMÓRDIOS</small><h2>Bandeja de dados</h2></div><button type="button" class="dice-icon-button" onclick="toggleDice()" aria-label="Fechar">✕</button></div>
  <div id="diceStyles" class="dice-styles" role="group" aria-label="Estilo dos dados"></div>
  <div class="dice-tray"><canvas id="diceCanvas" role="img" aria-label="Animação dos dados; resultados disponíveis abaixo"></canvas><div class="dice-tray-note" id="diceTrayNote">Escolha os dados e role</div></div>
  <div id="dicePicker" class="dice-picker" aria-label="Escolher dados"></div>
  <div class="dice-queue-line"><div id="diceQueue" class="dice-queue"></div><button type="button" id="diceClear" class="dice-icon-button" onclick="limparDados()" title="Limpar dados" aria-label="Limpar dados"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></svg></button></div>
  <label class="dice-bonus-label" for="diceBonus">Modificador <input id="diceBonus" type="number" step="1" min="-10000" max="10000" value="0"></label>
  <button type="button" id="diceBtnRolar" class="dice-roll-button" onclick="rolarDadosManuais()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="m12 2 10 6v8l-10 6-10-6V8zM2 8l10 6 10-6M12 14v8"/></svg><span>Rolar dados</span></button>
  <div id="diceResult" class="dice-result" role="status" aria-live="polite" hidden><div id="diceRolls"></div><div id="diceSum"></div></div>
  <p class="dice-help">d4: leia o vértice superior. d100: dezenas + unidades; 00 + 0 vale 100.</p>
</section>

<script>
  const logoImg = document.querySelector('#navLogo img');
  logoImg.classList.add('logo-entrada');
  logoImg.addEventListener('animationend', () => {
    logoImg.classList.remove('logo-entrada');
    logoImg.classList.remove('logo-girar');
  });

  function toggleMenu() {
    Sons.toggle();
    logoImg.classList.remove('logo-girar');
    void logoImg.offsetWidth;
    logoImg.classList.add('logo-girar');
    document.getElementById('navMenu').classList.toggle('aberto');
  }

  document.addEventListener('click', e => {
    if (!document.getElementById('navLogo').contains(e.target))
      document.getElementById('navMenu').classList.remove('aberto');
  });

  function sair() {
    return PrimordiosAuth.sair();
  }


  window.addEventListener('load', async () => {
    if (!await PrimordiosAuth.ready) return;
    const personagemDaSessao=new URLSearchParams(location.search).get('personagem');
    if(personagemDaSessao&&window.CloudFichas){try{restaurarDadosFicha(await CloudFichas.get(personagemDaSessao));}catch{location.replace('inventario.html');return;}}
    if (window.CloudFichas) await CloudFichas.init();
    carregarEstadoBase();
    if (window.CloudFichas && estado.persistido && estado.id) {
      try { restaurarDadosFicha(await CloudFichas.get(estado.id)); carregarEstadoBase(); }
      catch (error) {
        if (error.status === 404) { alert('Esta ficha foi excluída ou não está disponível.'); location.replace('inventario.html'); return; }
      }
    }
    renderFicha();
    salvarPersonagem();
  });

  function salvarPersonagem() { salvarFichaAtual(); }
</script>
<script src="../scripts/ficha-mesa.js?v=damage-2"></script>
<script src="../scripts/espera-vinil.js"></script>
</body>
</html>
