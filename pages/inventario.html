<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Primórdios — Inventário</title>
<link rel="icon" href="../assets/images/LogoT.png" type="image/png">
<link rel="stylesheet" href="../styles/global.css">
<link rel="stylesheet" href="../styles/tela1.css">
<link rel="stylesheet" href="../styles/inventario.css">
<link rel="stylesheet" href="../styles/preferencias.css">
<script src="../scripts/i18n-content.js"></script>
<script src="../scripts/preferencias.js"></script>
<script src="../scripts/auth-online.js"></script>
<link rel="stylesheet" href="../styles/fichas-online.css">
<link rel="stylesheet" href="../styles/consentimento-audio.css">
<link rel="stylesheet" href="../styles/mobile.css?v=mobile-1">
</head>
<body>

<!-- Navbar -->
<div id="navLogo" onclick="toggleMenu()">
  <img src="../assets/images/LogoT.png" alt="Primórdios">
  <div id="navMenu">
    <div class="nav-item" onclick="Sons.nav();window.location.href='inventario.html'"><span class="nav-item-icone">⚔</span> Inventário</div>
    <div class="nav-item" onclick="Sons.nav();novoPersonagem()"><span class="nav-item-icone">✦</span> Novo Personagem</div>
    <div class="nav-item" onclick="Sons.nav();window.location.href='livro.html'"><span class="nav-item-icone">⁂</span> Livro</div>
    <div class="nav-item" onclick="Sons.nav();window.location.href='tabletop.html'"><span class="nav-item-icone">⬡</span> TableTop</div>
    <div class="nav-item" onclick="Sons.nav();window.location.href='configuracoes.html'"><span class="nav-item-icone">⚙</span> Configurações</div>
    <div class="nav-item nav-sair" onclick="Sons.back();sair()"><span class="nav-item-icone">↩</span> Sair</div>
  </div>
</div>

<!-- Tela principal -->
<section class="tela inv-tela">
  <h1 class="titulo-tela">Inventário</h1>
  <p class="subtitulo-tela">Seus personagens</p>

  <div id="controlesPersonagens" class="inv-controles" hidden>
    <label class="inv-busca">
      <span>Buscar personagem</span>
      <input id="buscaPersonagem" type="search" placeholder="Nome, classe ou descrição" data-i18n-placeholder="Nome, classe ou descrição" oninput="renderLista()">
    </label>
    <label class="inv-ordenacao">
      <span>Ordenar por</span>
      <select id="ordenacaoPersonagens" onchange="renderLista()">
        <option value="recentes">Mais recentes</option>
        <option value="nome-asc">Nome (A–Z)</option>
        <option value="nome-desc">Nome (Z–A)</option>
        <option value="nivel-desc">Nível (maior primeiro)</option>
      </select>
    </label>
    <p id="resumoPersonagens" class="inv-resumo" aria-live="polite"></p>
  </div>
  <div id="listaPersonagens" class="inv-grid"></div>
</section>

<!-- ===== POPUP CONFIRMAR DELETE ===== -->
<div id="popupDelete">
  <div class="popup-delete-box">
    <div class="popup-delete-icone">⚠</div>
    <div class="popup-delete-titulo">Tem certeza?</div>
    <div class="popup-delete-sub">Esta ação é irreversível. O personagem será apagado permanentemente.</div>
    <div class="popup-delete-acoes">
      <button class="popup-delete-btn-cancelar" onclick="Sons.back();fecharDelete()">Cancelar</button>
      <button class="popup-delete-btn-confirmar" onclick="Sons.del();confirmarDelete()">Apagar</button>
    </div>
  </div>
</div>

<script src="../scripts/estado.js?v=mana-1"></script>
<script src="../scripts/consentimento-audio.js"></script>
<script src="../scripts/audio.js"></script>
<script src="../scripts/sons.js"></script>
<script>
  // ===== NAVBAR =====
  const logoImg = document.querySelector('#navLogo img');
  logoImg.classList.add('logo-entrada');
  logoImg.addEventListener('animationend', () => {
    logoImg.classList.remove('logo-entrada');
    logoImg.classList.remove('logo-girar');
  });

  function toggleMenu() {
    Sons.toggle();
    logoImg.classList.remove('logo-girar');
    void logoImg.offsetWidth;
    logoImg.classList.add('logo-girar');
    document.getElementById('navMenu').classList.toggle('aberto');
  }

  document.addEventListener('click', e => {
    if (!document.getElementById('navLogo').contains(e.target))
      document.getElementById('navMenu').classList.remove('aberto');
  });

  function sair() {
    return PrimordiosAuth.sair();
  }

  // ===== PERSONAGENS =====
  function getUsuarioLogado() {
    const s = localStorage.getItem('primordios_logado');
    return lerJSON(localStorage, 'primordios_logado', null)?.usuario || null;
  }

  function getPersonagens() {
    const user = getUsuarioLogado();
    if (!user) return [];
    return obterPersonagens(user);
  }

  function salvarPersonagens(lista) {
    const user = getUsuarioLogado();
    if (!user) return;
    return gravarPersonagens(user, lista);
  }

  // ===== RENDER LISTA =====
  function renderLista() {
    const container = document.getElementById('listaPersonagens');
    const personagens = getPersonagens();
    const controles = document.getElementById('controlesPersonagens');
    const busca = document.getElementById('buscaPersonagem').value.trim();
    const termo = busca.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('pt-BR');
    const ordenacao = document.getElementById('ordenacaoPersonagens').value;
    container.innerHTML = '';
    controles.hidden = personagens.length === 0;
    PrimordiosI18n.set(document.getElementById('resumoPersonagens'),personagens.length===1?'{count} personagem':'{count} personagens',{count:personagens.length});

    if (personagens.length === 0) {
      container.innerHTML = `
        <div class="inv-vazio">
          <div class="inv-vazio-icone">✦</div>
          <div class="inv-vazio-texto">Nenhum personagem criado ainda.</div>
          <div class="inv-vazio-sub">Clique em "Novo Personagem" para começar.</div>
        </div>`;
      return;
    }

    const encontrados = personagens
      .map((personagem, indice) => ({ personagem, indice }))
      .filter(({ personagem }) => {
        const campos = [personagem.nomePersonagem, personagem.classe, personagem.desc];
        const texto = campos.filter(campo => typeof campo === 'string').join(' ')
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('pt-BR');
        return texto.includes(termo) || !!window.PrimordiosI18n?.match(personagem.classe || '',termo);
      });

    encontrados.sort((a, b) => {
      if (ordenacao === 'nome-asc' || ordenacao === 'nome-desc') {
        const comparacao = (a.personagem.nomePersonagem || '').localeCompare(
          b.personagem.nomePersonagem || '', 'pt-BR', { sensitivity: 'base' }
        );
        return ordenacao === 'nome-asc' ? comparacao : -comparacao;
      }
      if (ordenacao === 'nivel-desc') {
        return (Number(b.personagem.nivel) || 0) - (Number(a.personagem.nivel) || 0);
      }
      return b.indice - a.indice;
    });

    const resumo = document.getElementById('resumoPersonagens');
    PrimordiosI18n.set(resumo, busca ? (personagens.length===1?'{found} de {total} personagem encontrado':'{found} de {total} personagens encontrados') : (personagens.length===1?'{count} personagem':'{count} personagens'),{found:encontrados.length,total:personagens.length,count:personagens.length});

    if (encontrados.length === 0) {
      container.innerHTML = `
        <div class="inv-vazio">
          <div class="inv-vazio-icone">⌕</div>
          <div class="inv-vazio-texto">Nenhum personagem encontrado.</div>
          <div class="inv-vazio-sub">Tente buscar por outro nome, classe ou descrição.</div>
        </div>`;
      return;
    }

    encontrados.forEach(({ personagem: p, indice: idx }) => {
      const card = document.createElement('div');
      card.className = 'inv-card';
      card.innerHTML = `
        <div class="inv-card-foto" onclick="abrirFicha(${idx})">
          ${p.foto
            ? `<img data-i18n-skip src="${/^data:image\/(png|jpe?g|webp|gif);/i.test(p.foto) ? escaparHTML(p.foto) : ''}" alt="${escaparHTML(p.nomePersonagem)}">`
            : p.hasPhoto ? `<img data-i18n-skip data-retrato="${escaparHTML(p.id)}" alt="${escaparHTML(p.nomePersonagem)}" loading="lazy">` : `<div class="inv-card-foto-vazia">✦</div>`}
        </div>
        <div class="inv-card-info" onclick="abrirFicha(${idx})">
          <div class="inv-card-nome">${escaparHTML(p.nomePersonagem || '—')}</div>
          <div class="inv-card-classe">${escaparHTML(p.classe || '')} ${p.nivel ? '· <span data-i18n>Nível</span> ' + p.nivel : ''}</div>
          <div class="inv-card-desc" ${p.desc ? 'data-i18n-skip' : ''}>${p.desc ? escaparHTML(p.desc) : '<span data-i18n>Sem descrição.</span>'}</div>
        </div>
        <div class="inv-card-acoes">
          <button class="inv-btn-ver" onclick="Sons.confirm();abrirFicha(${idx})">Ver Ficha</button>
          <button class="inv-btn-del" onclick="Sons.del();abrirDelete(${idx})">✕</button>
        </div>`;
      container.appendChild(card);
      const portrait = card.querySelector('[data-retrato]');
      if (portrait && window.CloudFichas) {
        const user = getUsuarioLogado();
        CloudFichas.portrait(p.id).then(foto => { if (portrait.isConnected && getUsuarioLogado() === user && /^data:image\/(png|jpe?g|webp|gif);base64,/i.test(foto)) portrait.src = foto; }).catch(() => {});
      }
    });
  }

  // ===== FICHA =====
  async function abrirFicha(idx) {
    const personagens = getPersonagens();
    const p = personagens[idx];
    if (!p) return;
    if (window.CloudFichas) {
      const user = getUsuarioLogado();
      try {
        const record = await CloudFichas.get(p.id);
        if (getUsuarioLogado() !== user) return;
        restaurarDadosFicha(record); window.location.href = 'tela5.html';
      } catch (error) { alert(PrimordiosI18n.t(error.message || 'Não foi possível abrir a ficha.')); }
      return;
    }
    if (!p.estadoCompleto || !p.estadoCompleto.classe) return;

    restaurarDadosFicha(p);

    window.location.href = 'tela5.html';
  }

  // ===== DELETE =====
  let _idxParaDeletar = null;
  let _idParaDeletar = null;

  function abrirDelete(idx) {
    _idxParaDeletar = idx;
    _idParaDeletar = getPersonagens()[idx]?.id;
    document.getElementById('popupDelete').classList.add('aberto');
  }

  function fecharDelete() {
    _idxParaDeletar = null;
    _idParaDeletar = null;
    document.getElementById('popupDelete').classList.remove('aberto');
  }

  async function confirmarDelete() {
    if (_idxParaDeletar === null) return;
    if (window.CloudFichas) {
      const id = _idParaDeletar; if (!id) return;
      try { await CloudFichas.remove(id); fecharDelete(); renderLista(); }
      catch (error) { alert(PrimordiosI18n.t(error.message || 'Não foi possível excluir a ficha.')); }
      return;
    }
    const lista = getPersonagens();
    lista.splice(_idxParaDeletar, 1);
    if (!salvarPersonagens(lista)) return;
    fecharDelete();
    renderLista();
  }

  document.getElementById('popupDelete').addEventListener('click', function(e) {
    if (e.target === this) fecharDelete();
  });


  window.addEventListener('load', async () => {
    if (!await PrimordiosAuth.ready) return;
    if (!getUsuarioLogado()) { window.location.href = 'tela0.html'; return; }
    if (window.CloudFichas) {
      await CloudFichas.init();
      const button = document.createElement('button'); button.type = 'button'; button.className = 'fichas-importar-acao'; button.textContent = 'Importar fichas deste navegador'; button.onclick = abrirImportacaoFichas;
      document.getElementById('listaPersonagens').before(button);
    }
    renderLista();
  });
  window.addEventListener('primordios:fichas', () => { if (window.CloudFichas) renderLista(); });

  function abrirImportacaoFichas() {
    const dialog = document.createElement('dialog'); dialog.className = 'fichas-dialog';
    const title = document.createElement('h2'); title.textContent = 'Importar fichas locais'; dialog.append(title);
    const help = document.createElement('p'); help.className = 'fichas-importar-aviso'; help.textContent = 'Selecione apenas as fichas que são suas. Elas serão copiadas para a conta Google atual. Os originais continuarão neste navegador; repetir a importação não cria duplicatas.'; dialog.append(help);
    const entries = [];
    for (const source of Object.keys(localStorage).filter(key => key.startsWith('primordios_personagens_'))) {
      const records = lerJSON(localStorage, source, []); if (!Array.isArray(records)) continue;
      for (const record of records) {
        if (!record || typeof record !== 'object' || !record.nomePersonagem) continue;
        const row = document.createElement('label'); row.className = 'fichas-importar-linha';
        const checkbox = document.createElement('input'); checkbox.type = 'checkbox';
        const text = document.createElement('span'); PrimordiosI18n.set(text,'{name} · {class} · conta local {account}',{name:record.nomePersonagem,class:record.classe || record.estadoCompleto?.classe || '—',account:source.slice('primordios_personagens_'.length)});
        row.append(checkbox, text); dialog.append(row); entries.push({ source, record, checkbox, text });
      }
    }
    const info = document.createElement('p'); info.setAttribute('role','status'); info.textContent = entries.length ? 'Nenhuma ficha será enviada sem sua seleção.' : 'Nenhuma ficha local encontrada neste navegador.'; dialog.append(info);
    const send = document.createElement('button'); send.type = 'button'; send.textContent = 'Importar selecionadas'; send.disabled = !entries.length;
    send.onclick = async () => {
      const selected = entries.filter(entry => entry.checkbox.checked); if (!selected.length) { info.textContent = 'Selecione ao menos uma ficha.'; return; }
      send.disabled = true; let success = 0;
      for (const entry of selected) {
        entry.checkbox.disabled = true;
        try { await CloudFichas.import(entry.source, entry.record); PrimordiosI18n.set(entry.text,'{name} — cópia confirmada online',{name:entry.record.nomePersonagem}); entry.checkbox.checked = false; success++; }
        catch (error) { delete entry.text.dataset.i18nKey;delete entry.text.dataset.i18nParams;const name=document.createElement('span');name.dataset.i18nSkip='';name.textContent=entry.record.nomePersonagem+' — ';const message=document.createElement('span');message.setAttribute('data-i18n','');message.textContent=error.message;entry.text.replaceChildren(name,message);entry.checkbox.disabled = false; }
      }
      PrimordiosI18n.set(info,'{done} de {total} fichas confirmadas online. Os originais foram preservados.',{done:success,total:selected.length}); send.disabled = false; renderLista();
    };
    const close = document.createElement('button'); close.type = 'button'; close.textContent = 'Fechar'; close.onclick = () => dialog.close();
    dialog.append(send,close); dialog.addEventListener('close', () => dialog.remove(), { once:true }); document.body.append(dialog); dialog.showModal();
  }
</script>
<script src="../scripts/espera-vinil.js"></script>
</body>
</html>
